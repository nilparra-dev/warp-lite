name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          # The ONNX models and PDBs are tracked with LFS but are not needed
          # for a check build with the default features.
          lfs: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install protoc and NASM
        run: choco install protoc nasm -y --no-progress
      - name: Check
        shell: pwsh
        run: |
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          cargo check --bin warp-lite --features "gui,skip_login"
